<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>資訊服務</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #F4EEE2;
    color: #4A3B30;
    font-family: 'Georgia', '新細明體', serif;
    line-height: 1.9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    text-align: center;
    max-width: 420px;
  }
  .box p {
    font-size: 15px;
    color: #6B6B6B;
  }
</style>
</head>
<body>
  <div class="box">
    <p>本服務僅提供一般性財務資訊整理，非放款機構、非金融機構。</p>
  </div>
</body>
</html>
